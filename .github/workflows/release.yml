name: Release

# Create a GitHub release from a version tag (`npm version patch && git push --tags`).
# The release uploads exactly the three assets a community install needs:
# main.js, manifest.json, styles.css.
on:
  push:
    tags:
      - '*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks (lint + tests + build)
        run: |
          npm run lint
          npm test
          npm run build

      - name: Sync versions.json from the tag
        run: node version-bump.mjs
        env:
          npm_package_version: ${{ github.ref_name }}

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
            
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
